# nRF5340 Audio
CONFIG_NRF5340_AUDIO=y

CONFIG_SAMPLE_RATE_CONVERTER=y
CONFIG_SAMPLE_RATE_CONVERTER_FILTER_SIMPLE=y

# General
CONFIG_DEBUG=n
CONFIG_ASSERT=n
CONFIG_STACK_USAGE=n
CONFIG_THREAD_MONITOR=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_UART_CONSOLE=n
CONFIG_BOOT_BANNER=n


CONFIG_USB_DEVICE_STACK_NEXT=y

#CONFIG_BT_AUDIO_PREF_SAMPLE_RATE_16KHZ=y
CONFIG_STREAM_BIDIRECTIONAL=y
CONFIG_UDC_NRF_THREAD_STACK_SIZE=1024
CONFIG_USBD_THREAD_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4192
CONFIG_BT_AUDIO_PREF_SAMPLE_RATE_24KHZ=y

CONFIG_BT_LOG_SNIFFER_INFO=y
CONFIG_USBD_HID_SUPPORT=y

CONFIG_USBD_LOG_LEVEL_OFF=y
CONFIG_USBD_HID_LOG_LEVEL_OFF=y
CONFIG_UDC_DRIVER_LOG_LEVEL_OFF=y
#CONFIG_AUDIO_SOURCE_I2S=y
CONFIG_BLE_ACL_CONN_INTERVAL=6
CONFIG_BLE_ACL_CONN_INTERVAL_SLOW=6
CONFIG_BT_AUTO_PHY_UPDATE=y
CONFIG_USBD_HID_OUT_BUF_COUNT=256
CONFIG_USBD_HID_IN_BUF_COUNT=256
CONFIG_USBD_UAC2_LOG_LEVEL_OFF=y
CONFIG_MONO_TO_ALL_RECEIVERS=y



# Bluetooth
# Default value from src/bluetooth/Kconfig.defaults.
# BT_PRIVACY is default turned off to ease the development.
# Should be turned on before production.
# CONFIG_BT_PRIVACY=y

# USB
# Default values from src/modules/Kconfig.defaults.
# USB VID and PID must be changed before production.
# CONFIG_USB_DEVICE_VID=0x1915
# CONFIG_USB_DEVICE_PID=0x530A
