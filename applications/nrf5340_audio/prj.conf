# nRF5340 Audio
CONFIG_NRF5340_AUDIO=y
CONFIG_SAMPLE_RATE_CONVERTER=y
CONFIG_SAMPLE_RATE_CONVERTER_FILTER_SIMPLE=y

# General
#CONFIG_DEBUG=y
#CONFIG_DEBUG_INFO=y
CONFIG_ASSERT=y
#CONFIG_STACK_USAGE=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_STACK_SENTINEL=y
CONFIG_INIT_STACKS=y
CONFIG_BT=y
CONFIG_NET_BUF_POOL_USAGE=y

# Uart driver
CONFIG_SERIAL=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_TAG_MAX_LEN=2
CONFIG_LOG_TAG_DEFAULT="--"
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_BT_SECURITY_ERR_TO_STR=y

# Use this for debugging thread usage
#CONFIG_LOG_THREAD_ID_PREFIX=y

# Console related defines
CONFIG_CONSOLE=n
CONFIG_RTT_CONSOLE=n
CONFIG_UART_CONSOLE=n

# Shell related defines
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_USE_SEGGER_RTT=n
## Disable logs on RTT
CONFIG_SHELL_RTT_INIT_LOG_LEVEL_NONE=n
CONFIG_SHELL_BACKEND_RTT=n
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_VT100_COMMANDS=y
CONFIG_SHELL_VT100_COLORS=y
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_SHELL_CMD_BUFF_SIZE=128
## Reduce shell memory usage
CONFIG_SHELL_WILDCARD=n
CONFIG_SHELL_HELP_ON_WRONG_ARGUMENT_COUNT=n
CONFIG_SHELL_STATS=n
CONFIG_SHELL_CMDS=n
CONFIG_SHELL_HISTORY=y

# Turn off default shell commands
CONFIG_I2C_SHELL=n
CONFIG_HWINFO_SHELL=n
CONFIG_CLOCK_CONTROL_NRF_SHELL=n
CONFIG_FLASH_SHELL=n
CONFIG_DEVICE_SHELL=n

# Suppress LOG_ERR messages from sd_check_card_type. Because SPI_SDHC has no card presence method,
# assume card is in slot. Thus error message is always shown if card is not inserted
CONFIG_SD_LOG_LEVEL_OFF=y

# Suppress LOG_INF messages from hci_core
CONFIG_BT_HCI_CORE_LOG_LEVEL_WRN=y

# BT related configs
CONFIG_BT_ISO_TX_BUF_COUNT=3
CONFIG_BT_BUF_ACL_TX_COUNT=3
CONFIG_BT_ATT_TX_COUNT=12

#CONFIG_BT_AUDIO_PREF_SAMPLE_RATE_24KHZ=y
#CONFIG_BT_AUDIO_PRESENTATION_DELAY_US=40000
#CONFIG_BT_AUDIO_BITRATE_BROADCAST_SRC=64000


CONFIG_BT_DEVICE_NAME="OZLO"
CONFIG_BT_LOG_SNIFFER_INFO=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_NRF_THREAD_STACK_SIZE=1024
CONFIG_USBD_THREAD_STACK_SIZE=2048
CONFIG_UDC_DRIVER_HIGH_SPEED_SUPPORT_ENABLED=n
CONFIG_USBD_MAX_SPEED_FULL=y

CONFIG_DEVICE_LOCATION_SET_RUNTIME=n
CONFIG_USBD_AUDIO2_CLASS=y

CONFIG_SPIN_VALIDATE=n
CONFIG_NRFX_CLOCK=n
#CONFIG_BT_BONDABLE=n
CONFIG_DEBUG=n
CONFIG_DEBUG_INFO=n
#CONFIG_STACK_USAGE=n
#CONFIG_STACK_SENTINEL=n
CONFIG_SPIN_VALIDATE=n

#CONFIG_IPC_RADIO_BT=y
#CONFIG_IPC_RADIO_BT_HCI_IPC=y
CONFIG_STREAM_BIDIRECTIONAL=n
CONFIG_SOC_NRF54H20_CPURAD_ENABLE=y
CONFIG_UDC_NRF=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4069
CONFIG_USB_DRIVER_LOG_LEVEL_OFF=y
#CONFIG_THREAD_ANALYZER=y
#CONFIG_THREAD_ANALYZER_USE_PRINTK=y
#CONFIG_THREAD_ANALYZER_AUTO=y
#CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=5
CONFIG_THREAD_NAME=y
CONFIG_HEAP_MEM_POOL_SIZE=1024


CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_LOG_MODE_DEFERRED=n
CONFIG_ASSERT=y
CONFIG_DEBUG_INFO=y
CONFIG_THREAD_STACK_INFO=y