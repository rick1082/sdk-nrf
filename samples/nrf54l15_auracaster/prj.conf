CONFIG_MAIN_STACK_SIZE=2048

CONFIG_BT=y
CONFIG_LOG=y
CONFIG_BT_AUDIO=y
CONFIG_BT_ISO_BROADCASTER=y
CONFIG_BT_BAP_BROADCAST_SOURCE=y

CONFIG_BT_ISO_MAX_CHAN=2
CONFIG_BT_BAP_BROADCAST_SRC_STREAM_COUNT=2
# Two streams in one subgroup (stereo)
CONFIG_BT_BAP_BROADCAST_SRC_SUBGROUP_COUNT=1

CONFIG_BT_ISO_TX_BUF_COUNT=16
CONFIG_BT_ISO_TX_MTU=60

CONFIG_BROADCAST_ID=0x123456
CONFIG_BT_DEVICE_NAME="nRF54L15_PDM"
CONFIG_USE_USB_AUDIO_INPUT=n
CONFIG_BAP_BROADCAST_16_2_1=y
CONFIG_SW_CODEC_LC3_T2_SOFTWARE=y
CONFIG_FPU=y
CONFIG_NEWLIB_LIBC=y
CONFIG_CMSIS_DSP=y
CONFIG_CLOCK_CONTROL=y
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

#CONFIG_AUDIO_DMIC_LOG_LEVEL_DBG=y