sample:
  description: Bluetooth LE Audio broadcast source streaming PDM microphone
    input, LC3-encoded on the application core
  name: nRF54L15 Auracaster
tests:
  # The application unconditionally uses DT_NODELABEL(dmic_dev), so only
  # boards whose overlay provides a PDM node can be built. The nRF5340 /
  # nRF52 overlays inherited from the upstream Zephyr bap_broadcast_source
  # sample do not define one and are therefore not listed here.
  sample.nrf54l15_auracaster:
    harness: bluetooth
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
      - xiao_nrf54l15/nrf54l15/cpuapp
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
    tags:
      - bluetooth
      - le-audio
      - dmic
    sysbuild: true
