CONFIG_I2C=y
CONFIG_SENSOR=y

# LSM6DS3TR-C (driven by the st,lsm6dsl driver) on the XIAO nRF54L15 Sense.
# ODR/FS default to 0 ("selected at runtime"), which leaves the chip powered
# down, so pin them here: 104 Hz, +/-2g, +/-250 dps.
CONFIG_LSM6DSL_ACCEL_ODR=4
CONFIG_LSM6DSL_ACCEL_FS=2
CONFIG_LSM6DSL_GYRO_ODR=4
CONFIG_LSM6DSL_GYRO_FS=250
CONFIG_LSM6DSL_ENABLE_TEMP=y

# %f in printf() on picolibc
CONFIG_PICOLIBC_IO_FLOAT=y

# USR button -> left mouse button
CONFIG_INPUT=y

# Hardware FPU for the gyro integration
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# The Bluetooth stack overruns the default stacks here; without stack
# protection that silently corrupts the net_buf pools instead of faulting.
CONFIG_HW_STACK_PROTECTION=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_BT_TX_PROCESSOR_STACK_SIZE=1024

# Bluetooth HID over GATT
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="XIAO Air Mouse"
# 962 = HID Mouse
CONFIG_BT_DEVICE_APPEARANCE=962
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=2

CONFIG_BT_HIDS=y
CONFIG_BT_HIDS_INPUT_REP_MAX=1
CONFIG_BT_HIDS_OUTPUT_REP_MAX=0
CONFIG_BT_HIDS_FEATURE_REP_MAX=0
CONFIG_BT_HIDS_ATTR_MAX=20
CONFIG_BT_HIDS_MAX_CLIENT_COUNT=1
CONFIG_BT_HIDS_DEFAULT_PERM_RW_ENCRYPT=y
CONFIG_BT_CONN_CTX=y

# HIDS registers 6 characteristics and 8 16-bit UUIDs; the NCS GATT pool
# defaults (5 and 10) are too small and bt_hids_init() would fail with -ENOMEM.
CONFIG_BT_GATT_CHRC_POOL_SIZE=10
CONFIG_BT_GATT_UUID16_POOL_SIZE=20

# Device Information Service - hosts use the PnP IDs to pick a HID driver
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="Seeed Studio"
CONFIG_BT_DIS_PNP=y
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_PNP_VID=0x1915
CONFIG_BT_DIS_PNP_PID=0xEEEE
CONFIG_BT_DIS_PNP_VER=0x0100

# Just-works pairing (the device has no display or keypad) plus bond storage
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y

# Ask the host for a short connection interval so cursor motion stays smooth
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

CONFIG_MAIN_STACK_SIZE=3584

# --------------------------------------------------------------------------
# LE Audio: PDM microphone as a BAP unicast server source
# (ported from samples/bluetooth/bap_unicast_server_nrf54l15)
# --------------------------------------------------------------------------
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_CLOCK_CONTROL=y

# BT_AUDIO depends on UTF8
CONFIG_UTF8=y
CONFIG_BT_AUDIO=y
CONFIG_BT_BAP_UNICAST_SERVER=y
CONFIG_BT_ASCS=y
# Source only: the board has a microphone and no speaker. With no sink ASE and
# no Sink PAC, a host enumerates a capture endpoint and no render endpoint.
CONFIG_BT_ASCS_MAX_ASE_SNK_COUNT=0
CONFIG_BT_ASCS_MAX_ASE_SRC_COUNT=1
CONFIG_BT_PAC_SNK=n
CONFIG_BT_ISO_PERIPHERAL=y
CONFIG_BT_ISO_TX_BUF_COUNT=16
CONFIG_BT_ISO_MAX_CHAN=1
CONFIG_BT_AUDIO_CODEC_CFG_MAX_METADATA_SIZE=80

# Microphone Control Service, so the client can mute/unmute the microphone.
# No AICS instances - gain is fixed at build time.
CONFIG_BT_MICP_MIC_DEV=y
CONFIG_BT_MICP_MIC_DEV_AICS_INSTANCE_COUNT=0
# Mandatory to support at least 1 for ASCS
CONFIG_BT_ATT_PREPARE_COUNT=8
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_BONDABLE=y

# The client picks QoS; do not fight it with our own parameter updates.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n

# T2 software LC3 encoder (needs the hard-float ABI, hence CONFIG_FPU above)
CONFIG_SW_CODEC_LC3_T2_SOFTWARE=y
CONFIG_LC3_ENC_CHAN_MAX=1

# The LC3 encoder is stack hungry and BT audio does work in the system workqueue
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_CMD_TX_SIZE=255

CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_THREAD_NAME=y

# Deferred logging keeps UART writes out of the BT/ISO callbacks. The default
# 768 byte processing-thread stack is not enough for the wider messages here -
# it overflows, the thread is aborted, and all logging (including the fault
# report) goes silent.
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
