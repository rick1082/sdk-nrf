# Larger ACL buffers and data length for faster GATT discovery by phones
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_EVT_RX_SIZE=255

# The TMAS, CAS, ASCS and BASS service data does not fit in 31 octets of advertising data
CONFIG_BT_CTLR_ADV_DATA_LEN_MAX=191

# Room for periodic advertising reports containing the BASE
CONFIG_BT_CTLR_SDC_PERIODIC_SYNC_BUFFER_COUNT=10

# Store bonds so that the phone can reconnect after a reset
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
# Bonds are stored in the internal storage partition; the external flash is not used
CONFIG_SPI_NOR=n
# Allow the phone to pair again after it removed the bond on its side
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

# Output logs and the console (printk) over Segger RTT instead of UART
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
