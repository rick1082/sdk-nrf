CONFIG_BT=y
CONFIG_LOG=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
# Set preferred values based on BT_BAP_CONN_PARAM_RELAXED
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=50
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=70
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_PRIVACY=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_AUDIO=y
CONFIG_UTF8=y

CONFIG_BT_SMP=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_ATT_TX_COUNT=20

# TMAP support
CONFIG_BT_TMAP=y

# CAP
CONFIG_BT_CAP_ACCEPTOR=y

# BAP Unicast Server support (CIS)
CONFIG_BT_ISO_PERIPHERAL=y
CONFIG_BT_BAP_UNICAST_SERVER=y
# Mandatory to support at least 1 for ASCS. With the large metadata size below, long writes of
# an ASE need up to 5 prepare buffers with the default ATT MTU
CONFIG_BT_ATT_PREPARE_COUNT=5
CONFIG_BT_ASCS=y
CONFIG_BT_PAC_SNK=y
CONFIG_BT_ASCS_MAX_ASE_SNK_COUNT=1
CONFIG_BT_PAC_SRC=y
CONFIG_BT_ASCS_MAX_ASE_SRC_COUNT=1
CONFIG_BT_ISO_TX_BUF_COUNT=2

# BAP Broadcast Sink and Scan Delegator support (BIS)
CONFIG_BT_EXT_ADV=y
CONFIG_BT_PER_ADV_SYNC=y
CONFIG_BT_ISO_SYNC_RECEIVER=y
CONFIG_BT_BAP_SCAN_DELEGATOR=y
CONFIG_BT_BAP_BROADCAST_SINK=y
CONFIG_BT_BAP_BROADCAST_SNK_SUBGROUP_COUNT=2
CONFIG_BT_BAP_BROADCAST_SNK_STREAM_COUNT=2
CONFIG_BT_BAP_BASS_MAX_SUBGROUPS=2

# VCP support
CONFIG_BT_VCP_VOL_REND=y

# Support an ISO channel per ASE (2) and per BIS (2)
CONFIG_BT_ISO_MAX_CHAN=4
# Allocate 4 RX buffers per channel
CONFIG_BT_ISO_RX_BUF_COUNT=16

# Phones send more metadata than just the Streaming Audio Contexts (e.g. a CCID list in the ASE
# Enable operation, and program info in the BASE and the BASS Add Source operation)
CONFIG_BT_AUDIO_CODEC_CFG_MAX_METADATA_SIZE=255

# PAC Location Support
CONFIG_BT_PAC_SNK_LOC=y
CONFIG_BT_PAC_SRC_LOC=y

# Generic config
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_DEVICE_NAME="nRF54L15 Audio Headset"

# Audio output: LC3 decoding, I2S to a TLV320 DAC configured over I2C
CONFIG_FPU=y
CONFIG_LIBLC3=y
CONFIG_NRFX_I2S=y
CONFIG_CLOCK_CONTROL=y
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_RING_BUFFER=y
# The received audio is decoded in the Bluetooth RX thread
CONFIG_BT_RX_STACK_SIZE=12000
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
