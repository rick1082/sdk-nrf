CONFIG_AUDIO_DMIC=y
CONFIG_AUDIO=y
CONFIG_BT=y
CONFIG_LOG=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_ISO_PERIPHERAL=y
CONFIG_BT_AUDIO=y
CONFIG_BT_BAP_UNICAST_SERVER=y
CONFIG_BT_ASCS=y
CONFIG_BT_ASCS_MAX_ASE_SNK_COUNT=1
CONFIG_BT_ASCS_MAX_ASE_SRC_COUNT=1
CONFIG_BT_ISO_TX_BUF_COUNT=16
# Support an ISO channel per ASE
CONFIG_BT_ISO_MAX_CHAN=2

CONFIG_BT_AUDIO_CODEC_CFG_MAX_METADATA_SIZE=80

# Mandatory to support at least 1 for ASCS
CONFIG_BT_ATT_PREPARE_COUNT=8
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_DEVICE_NAME="nrf54l15_pdm_mic"
CONFIG_SW_CODEC_LC3_T2_SOFTWARE=y
CONFIG_FPU=y
CONFIG_NEWLIB_LIBC=y
CONFIG_BT_LOG_SNIFFER_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_CLOCK_CONTROL=y
CONFIG_LC3_ENC_CHAN_MAX=1
CONFIG_BT_BONDABLE=y
CONFIG_BT_SMP=y
CONFIG_LOG_BUFFER_SIZE=4096

# Enable DK LED and Buttons library
CONFIG_DK_LIBRARY=y
CONFIG_BT_SECURITY_ERR_TO_STR=y
CONFIG_BT_SMP_ERR_TO_STR=y