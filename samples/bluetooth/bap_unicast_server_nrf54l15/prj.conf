CONFIG_AUDIO=y
CONFIG_BT=y
CONFIG_LOG=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_ISO_PERIPHERAL=y
CONFIG_BT_AUDIO=y
CONFIG_BT_BAP_UNICAST_SERVER=y
CONFIG_BT_ASCS=y
CONFIG_BT_ASCS_MAX_ASE_SNK_COUNT=1
CONFIG_BT_ASCS_MAX_ASE_SRC_COUNT=1
CONFIG_BT_ISO_TX_BUF_COUNT=16
# Support an ISO channel per ASE
CONFIG_BT_ISO_MAX_CHAN=1

CONFIG_BT_AUDIO_CODEC_CFG_MAX_METADATA_SIZE=80

# Mandatory to support at least 1 for ASCS
CONFIG_BT_ATT_PREPARE_COUNT=8
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_DEVICE_NAME="nrf54l15_pdm_mic"
CONFIG_SW_CODEC_LC3_T2_SOFTWARE=y
CONFIG_FPU=y
CONFIG_NEWLIB_LIBC=y
CONFIG_BT_LOG_SNIFFER_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_CLOCK_CONTROL=y
CONFIG_LC3_ENC_CHAN_MAX=1
CONFIG_BT_BONDABLE=y
CONFIG_BT_SMP=y
CONFIG_LOG_BUFFER_SIZE=4096

# Enable DK LED and Buttons library
CONFIG_DK_LIBRARY=y
CONFIG_BT_SECURITY_ERR_TO_STR=y
CONFIG_BT_SMP_ERR_TO_STR=y

CONFIG_BT_MAX_CONN=2
CONFIG_BT_ATT_TX_COUNT=5
CONFIG_BT_BAS=y
CONFIG_BT_HIDS=y
CONFIG_BT_HIDS_MAX_CLIENT_COUNT=2
CONFIG_BT_HIDS_DEFAULT_PERM_RW_ENCRYPT=y
CONFIG_BT_GATT_UUID16_POOL_SIZE=40
CONFIG_BT_GATT_CHRC_POOL_SIZE=20
CONFIG_BT_CONN_CTX=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="NordicSemiconductor"
CONFIG_BT_DIS_PNP=y
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_PNP_VID=0x1915
CONFIG_BT_DIS_PNP_PID=0xEEEE
CONFIG_BT_DIS_PNP_VER=0x0100


CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

CONFIG_GPIO=y
CONFIG_NRFX_I2S20=y
CONFIG_CLOCK_CONTROL=y
CONFIG_RING_BUFFER=y

# The ACL connection interval needs to be scaled with 10ms
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=8
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=16

# Disabled the sink PAC to be a pure MIC
CONFIG_BT_PAC_SNK_LOC=n
CONFIG_BT_PAC_SNK=n
